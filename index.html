
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Vorschau</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    height:100vh;
    overflow:hidden;
}

#preview{
    width:100%;
    height:100vh;
    border:none;
    background:white;
}

#dot{
    position:fixed;
    bottom:20px;
    right:20px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:red;
    cursor:pointer;
    z-index:1000;
    box-shadow:0 0 10px rgba(255,0,0,0.6);
}

#panel{
    position:fixed;
    right:20px;
    bottom:50px;
    width:min(500px,90vw);
    height:350px;
    background:white;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    display:none;
    flex-direction:column;
    overflow:hidden;
    z-index:1000;
}

#panel.show{
    display:flex;
}

#code{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    padding:15px;
    font-family:monospace;
    font-size:14px;
}

#buttons{
    display:flex;
}

button{
    flex:1;
    padding:13px 5px;
    border:none;
    cursor:pointer;
    font-size:14px;
}

#run{
    background:#00b050;
    color:white;
}

#close{
    background:#e0e0e0;
}

#clear{
    background:#e53935;
    color:white;
}

#status{
    padding:5px;
    font-size:11px;
    text-align:center;
    background:#f5f5f5;
    color:#38834b;
}
</style>
</head>
<body>

<iframe id="preview"></iframe>

<div id="dot" title="Editor öffnen"></div>

<div id="panel">

    <textarea id="code"
    placeholder="HTML-Code hier einfügen..."></textarea>

    <div id="status">Bereit.</div>

    <div id="buttons">
        <button id="run">Anzeigen</button>
        <button id="clear">Löschen</button>
        <button id="close">Schließen</button>
    </div>

</div>

<script>
const dot = document.getElementById("dot");
const panel = document.getElementById("panel");
const code = document.getElementById("code");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

// Speicher-Schlüssel
const STORAGE_KEY = "html_shell_saved_code";

// Gespeicherten Code beim Laden wiederherstellen
const savedCode = localStorage.getItem(STORAGE_KEY);

if(savedCode !== null){
    code.value = savedCode;
    preview.srcdoc = savedCode;
    status.textContent = "✓ Gespeicherter Code geladen";
}

// Editor öffnen und schließen
dot.addEventListener("click", () => {
    panel.classList.toggle("show");
});

document.getElementById("close").addEventListener("click", () => {
    panel.classList.remove("show");
});

// Automatisch lokal speichern
code.addEventListener("input", () => {
    try {
        localStorage.setItem(STORAGE_KEY, code.value);
        status.textContent = "✓ Automatisch gespeichert";
    } catch(error) {
        status.textContent = "⚠ Speichern fehlgeschlagen";
    }
});

// Code anzeigen
document.getElementById("run").addEventListener("click", () => {
    preview.srcdoc = code.value;

    // Sicherheitshalber erneut speichern
    try {
        localStorage.setItem(STORAGE_KEY, code.value);
        status.textContent = "✓ Code gespeichert und angezeigt";
    } catch(error) {
        status.textContent = "⚠ Lokales Speichern fehlgeschlagen";
    }
});

// Gespeicherten Code löschen
document.getElementById("clear").addEventListener("click", () => {

    if(confirm("Möchtest du den gespeicherten Code wirklich löschen?")){

        code.value = "";

        localStorage.removeItem(STORAGE_KEY);

        preview.srcdoc = "";

        status.textContent = "✓ Gespeicherter Code gelöscht";
    }
});

</script>

</body>
</html>
